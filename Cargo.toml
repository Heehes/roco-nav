[package]
name = "roco-nav"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = "0.25"
imageproc = "0.25"
eframe = "0.29"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# 调试构建里，自身代码保持可调试，但对所有依赖（image/imageproc 等计算密集型库）
# 开启优化，否则图像缩放/匹配在 debug 下慢到像卡死。
[profile.dev.package."*"]
opt-level = 3
